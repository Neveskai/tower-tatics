[build]
  command = "yarn build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP report-only: adjust and switch to Content-Security-Policy when stable
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com https://*.google.com wss://*.firebaseio.com; img-src 'self' data: https:; font-src 'self' data:; frame-src 'self' https://*.google.com;"

[dev]
  command = "yarn dev"
  port = 8080
  targetPort = 8080
